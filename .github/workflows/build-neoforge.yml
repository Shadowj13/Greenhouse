name: Build and verify Greenhouse (NeoForge 26.3)
on:
  workflow_dispatch:
  push:
    branches: [main, 'fix/**']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build, verify models and run live server integration checks
        shell: pwsh
        run: ./gradlew.bat build integrationTest --console=plain
      - name: Hash installable JAR
        shell: pwsh
        run: |
          Get-ChildItem build/libs/*.jar | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -Encoding ascii "$($_.FullName).sha256"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Greenhouse-NeoForge-26.3
          path: |
            build/libs/*.jar
            build/libs/*.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload server test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Greenhouse-server-tests
          path: build/qa-results/
          if-no-files-found: warn
          retention-days: 30
